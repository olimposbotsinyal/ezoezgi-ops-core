# PROJECT_IDENTITY.yaml
#
# Bu repo'nun kimlik manifesti. `scripts/repo_guard.py` ve `scripts/preflight.py`
# tarafından okunur; amacı bu çalışma alanının başka bir proje/checkout ile
# yanlışlıkla karışmasını (örn. yanlış repo'da script çalıştırma, farklı bir
# projenin dosyalarının bu repoya kopyalanması) önlemektir.
#
# Bu dosya elle silinmemeli/taşınmamalı — silinirse repo_guard/preflight
# başarısız olur (bilinçli bir tasarım kararı).

project_name: "EzoEzgi (ASAF Core)"
