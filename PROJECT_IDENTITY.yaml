phase: v0.1.0-phase0-closed

canonical_paths:
  - apps/
  - services/
  - tools/
  - docs/
  - config/
  - policies/

forbidden_external_paths:
  - '../'
  - '~/Desktop/'
  - 'C:\Users\'
  - '/Users/'

owner: webcadisi@gmail.com
created_at: 2026-08-13

notes: >
  Bu dosya repo izolasyon doğrulaması için kullanılır. scripts/repo_guard.py
  bu dosyanın varlığını, repo_slug'ın beklenenle eşleştiğini ve
  canonical_paths altındaki klasörlerin gerçekten var olduğunu kontrol eder.
