# GECICI DOGRULAMA config'i -- infra/monitoring/prometheus/prometheus.yml'nin
# BIREBIR kopyasidir, yalnizca rule_files satiri bu dizindeki (repo DISI,
# C:\Temp\monitoring_bin\) validation_alerts.yaml'a isaret eder (kisaltilmis
# `for:` sureleri icerir, bkz. o dosyanin basligi). Repodaki gercek
# prometheus.yml / model_gateway_alerts.yaml HICBIR SEKILDE degistirilmedi.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: local-dev-validation
    service: ezoezgi-model-gateway

rule_files:
  - "validation_alerts.yaml"

scrape_configs:
  - job_name: "ezoezgi_model_gateway"
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:9108"]
        labels:
          env: local-dev-validation
          service: model-gateway
          instance: "serve_metrics-local"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
